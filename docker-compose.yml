version: '3.8'

services:
  mysql:
    image: mysql:8.0.36
    container_name: iq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123!
      MYSQL_DATABASE: iqenglish_db
      MYSQL_USER: iquser
      MYSQL_PASSWORD: iqpassword_123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123!"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: iq-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/iqnglish_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: iquser
      SPRING_DATASOURCE_PASSWORD: iqpassword_123!
      JWT_SECRET: c2VjdXJlX2lxbXlzdGVyb3VzX10pdXRfemVkcmV0X2tleV9myjkgZW5nbGlzaF8yMDI2X0F1dGhlbnRpY2F0aW9uX3Rva2VuX1N5c3RlbV8yNTRiaXQ=
      TALKIO_API_URL: https://api.talkik.ai/v1
      TALKIO_API_KEY: mock_talkio_prod_key_778899
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: iq-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
