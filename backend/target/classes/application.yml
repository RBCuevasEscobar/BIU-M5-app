spring:
  application:
    name: iq-english-tutoring-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: https://auth.iqenglish.mx
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  integrations:
    google-calendar:
      enabled: ${GOOGLE_CALENDAR_ENABLED:false}
      client-id: ${GOOGLE_CALENDAR_CLIENT_ID:mock-google-client-id}
    talkio:
      enabled: ${TALKIO_ENABLED:true}
      base-url: ${TALKIO_BASE_URL:https://api.talkio.ai/v1}
      api-key: ${TALKIO_API_KEY:mock-talkio-api-key}
      setup-accounts: ${TALKIO_SETUP_ACCOUNTS:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
