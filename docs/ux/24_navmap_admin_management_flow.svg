<svg width="1500" height="950" viewBox="0 0 1500 950" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      .bg-canvas { fill: #0B132B; }
      .grid-pattern { stroke: #1E293B; stroke-width: 0.8; stroke-dasharray: 4,4; }
      
      /* Node Styles */
      .node-entry { fill: #1E293B; stroke: #38BDF8; stroke-width: 2; rx: 8; }
      .node-page { fill: #FFFFFF; stroke: #002E6D; stroke-width: 1.8; rx: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
      .node-page-active { fill: #F0F9FF; stroke: #0284C7; stroke-width: 2.2; rx: 8; filter: drop-shadow(0 4px 8px rgba(2,132,199,0.25)); }
      .node-modal { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.8; rx: 8; stroke-dasharray: 6,3; }
      .node-success { fill: #F0FDF4; stroke: #166534; stroke-width: 2; rx: 8; }
      .node-api { fill: #1E1B4B; stroke: #818CF8; stroke-width: 1.5; rx: 6; }
      .node-decision { fill: #FEF3C7; stroke: #B45309; stroke-width: 1.8; rx: 6; }
      
      /* Typography */
      .map-title { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 900; fill: #FFFFFF; }
      .map-subtitle { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
      .node-header { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 800; fill: #002E6D; }
      .node-route { font-family: 'Inter', monospace; font-size: 10px; font-weight: 700; fill: #0284C7; }
      .node-body { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #334155; }
      .node-badge { font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 800; }
      .arrow-label { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; fill: #38BDF8; }
      .legend-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #E2E8F0; }
      
      /* Connectors & Markers */
      .conn-line { stroke: #38BDF8; stroke-width: 1.8; fill: none; }
      .conn-line-dashed { stroke: #F59E0B; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
      .conn-line-success { stroke: #22C55E; stroke-width: 2; fill: none; }
      .conn-line-api { stroke: #A78BFA; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22C55E" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA" />
    </marker>
  </defs>

  <rect width="1500" height="950" class="bg-canvas" />

  <!-- HEADER BAR -->
  <rect x="0" y="0" width="1500" height="74" fill="#141D38" stroke="#3A506B" stroke-width="1" />
  <rect x="28" y="16" width="42" height="42" rx="8" fill="#002E6D" stroke="#818CF8" stroke-width="1.5" />
  <text x="38" y="44" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">IQ</text>
  <text x="82" y="38" class="map-title">MAPA DE NAVEGACIÓN: FLUJO ADMINISTRATIVO Y SUPERVISIÓN</text>
  <text x="82" y="58" class="map-subtitle">Gestión Integral de Usuarios (Estudiante / Docente / Admin) y Programación de Grupos de Tutoría</text>
  
  <rect x="1260" y="18" width="210" height="38" rx="6" fill="#312E81" stroke="#818CF8" stroke-width="1.2" />
  <text x="1276" y="42" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C7D2FE">🛡️ Roles: ADMIN &amp; SUPERVISOR</text>

  <!-- ================= SUBFLOW A: GESTION DE USUARIOS ================= -->
  <rect x="40" y="100" width="690" height="820" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="40" y="100" width="690" height="34" rx="10" fill="#075985" />
  <text x="56" y="123" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">SUBFLUJO A: GESTIÓN DE USUARIOS Y ROLES (/users)</text>

  <!-- Node A1: Directorio General -->
  <rect x="64" y="150" width="642" height="130" rx="8" class="node-page" />
  <rect x="64" y="150" width="642" height="26" rx="8" fill="#002E6D" />
  <text x="78" y="168" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">VISTA PRINCIPAL: DIRECTORIO DE USUARIOS</text>
  <text x="78" y="196" class="node-route">/users (UserManagementPage.tsx)</text>
  <text x="78" y="216" class="node-body">• 4 Tarjetas de Métricas: Total Cuentas (124), Estudiantes (98), Docentes (18), Directivos (8)</text>
  <text x="78" y="234" class="node-body">• Filtros combinados: Búsqueda por texto, Filtro por Rol, Plantel y Estado de cuenta</text>
  <text x="78" y="252" class="node-body">• Tabla interactiva con paginación e iconos de acción (✏️ Editar, 🔑 Clave, 📜 Historial, 🗑️ Baja)</text>

  <!-- 3 Modales Columns under Users -->
  <!-- Modal A2: Crear Docente -->
  <rect x="64" y="320" width="200" height="250" rx="8" class="node-modal" />
  <text x="76" y="344" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#B45309">1. MODAL CREAR DOCENTE</text>
  <text x="76" y="362" class="node-route">15_midfi_create_teacher</text>
  <text x="76" y="386" class="node-body">• Nombre, Username, Email</text>
  <text x="76" y="404" class="node-body">• Rol: <strong>ROLE_TEACHER</strong></text>
  <text x="76" y="422" class="node-body">• Plantel asignado</text>
  <text x="76" y="440" class="node-body">• Especialidad: Book 2 (B1)</text>
  <text x="76" y="458" class="node-body">• Certificación: C2 Prof.</text>
  <text x="76" y="476" class="node-body">• Max Horas: 30 hrs/sem</text>
  <rect x="72" y="534" width="184" height="24" rx="4" fill="#E0F2FE" />
  <text x="80" y="550" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0369A1">POST /api/v1/users</text>

  <!-- Modal A3: Crear Admin / Supervisor -->
  <rect x="284" y="320" width="200" height="250" rx="8" class="node-modal" />
  <text x="296" y="344" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#B45309">2. MODAL CREAR ADMIN</text>
  <text x="296" y="362" class="node-route">16_midfi_create_admin</text>
  <text x="296" y="386" class="node-body">• Datos de responsable</text>
  <text x="296" y="404" class="node-body">• Rol: <strong>ROLE_SUPERVISOR</strong></text>
  <text x="296" y="422" class="node-body">• Alcance Multi-Campus</text>
  <text x="296" y="440" class="node-body">• Matriz de Permisos</text>
  <text x="296" y="458" class="node-body">• Exigir 2FA en 1er login</text>
  <text x="296" y="476" class="node-body">• Auditoría reforzada</text>
  <rect x="292" y="534" width="184" height="24" rx="4" fill="#E0F2FE" />
  <text x="300" y="550" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0369A1">POST /api/v1/users</text>

  <!-- Modal A4: Editar Usuario -->
  <rect x="504" y="320" width="202" height="250" rx="8" class="node-modal" />
  <text x="516" y="344" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#B45309">3. MODAL EDITAR USUARIO</text>
  <text x="516" y="362" class="node-route">19_midfi_edit_user</text>
  <text x="516" y="386" class="node-body">• Perfil student.carlos</text>
  <text x="516" y="404" class="node-body">• Estado: ACTIVE / INACT.</text>
  <text x="516" y="422" class="node-body">• Plantel asignado</text>
  <text x="516" y="440" class="node-body">• Nivel: Book 2 Fluency</text>
  <text x="516" y="458" class="node-body">• Módulo: Lesson 5B</text>
  <text x="516" y="476" class="node-body">• Actualizar currículum</text>
  <rect x="512" y="534" width="184" height="24" rx="4" fill="#DCFCE7" />
  <text x="520" y="550" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#166534">PUT /api/v1/users/{id}</text>

  <!-- User Flow Outcome Summary -->
  <rect x="64" y="600" width="642" height="300" rx="8" fill="#1E293B" stroke="#3A506B" />
  <text x="80" y="626" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">📋 Reglas de Validación de Usuarios:</text>
  <text x="80" y="650" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">• <strong>Unicidad:</strong> Username y Correo Institucional validados en backend con error 409 Conflict si existen.</text>
  <text x="80" y="674" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">• <strong>Inmutabilidad de Rol Docente/Estudiante:</strong> No se puede degradar un usuario con citas o calificaciones asignadas.</text>
  <text x="80" y="698" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">• <strong>Sincronización Curricular:</strong> Modificar el Libro en EditUserModal recalcula automáticamente el mapa de avance del estudiante.</text>

  <!-- Connectors Subflow A -->
  <path d="M 164 280 L 164 320" class="conn-line-dashed" marker-end="url(#arrow-amber)" />
  <path d="M 384 280 L 384 320" class="conn-line-dashed" marker-end="url(#arrow-amber)" />
  <path d="M 604 280 L 604 320" class="conn-line-dashed" marker-end="url(#arrow-amber)" />


  <!-- ================= SUBFLOW B: PROGRAMACION DE GRUPOS ================= -->
  <rect x="770" y="100" width="690" height="820" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.5" />
  <rect x="770" y="100" width="690" height="34" rx="10" fill="#312E81" />
  <text x="786" y="123" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">SUBFLUJO B: GESTIÓN Y PROGRAMACIÓN DE GRUPOS (/groups)</text>

  <!-- Node B1: Panel de Grupos -->
  <rect x="794" y="150" width="642" height="130" rx="8" class="node-page" />
  <rect x="794" y="150" width="642" height="26" rx="8" fill="#002E6D" />
  <text x="808" y="168" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">VISTA PRINCIPAL: GESTIÓN DE GRUPOS DE TUTORÍA</text>
  <text x="808" y="196" class="node-route">/groups (GroupManagementPage.tsx)</text>
  <text x="808" y="216" class="node-body">• 4 Tarjetas: Total Grupos (18), Cupo Total (90), Inscritos (74), Ocupación Promedio (82.2%)</text>
  <text x="808" y="234" class="node-body">• Barra de filtros: Búsqueda rápida, Filtro por Plantel y Filtro por Módulo</text>
  <text x="808" y="252" class="node-body">• Tabla de grupos con código, docente, horario, ocupación (4/5), estado y botón '+ Nuevo Grupo'</text>

  <!-- 2 Modales Columns under Groups -->
  <!-- Modal B2: Crear Grupo -->
  <rect x="794" y="320" width="310" height="250" rx="8" class="node-modal" />
  <text x="806" y="344" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#B45309">1. MODAL CREAR NUEVO GRUPO</text>
  <text x="806" y="362" class="node-route">13_midfi_create_group</text>
  <text x="806" y="386" class="node-body">• Código autogenerado: GRP-B2-L5B-01</text>
  <text x="806" y="404" class="node-body">• Nombre de la sesión de tutoría</text>
  <text x="806" y="422" class="node-body">• Plantel, Libro (Book 2) y Módulo (Lesson 5B)</text>
  <text x="806" y="440" class="node-body">• Docente asignado: Prof. Roberto Garza</text>
  <text x="806" y="458" class="node-body">• Capacidad fija: 5 alumnos (Regla R04)</text>
  <text x="806" y="476" class="node-body">• Horario y Aula (Jue 18:00 hrs • Aula 204)</text>
  <rect x="802" y="534" width="294" height="24" rx="4" fill="#E0F2FE" />
  <text x="812" y="550" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0369A1">POST /api/v1/tutoring-groups</text>

  <!-- Modal B3: Editar Grupo -->
  <rect x="1126" y="320" width="310" height="250" rx="8" class="node-modal" />
  <text x="1138" y="344" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#B45309">2. MODAL EDITAR GRUPO</text>
  <text x="1138" y="362" class="node-route">18_midfi_edit_group</text>
  <text x="1138" y="386" class="node-body">• Ajuste de Docente o Horario asignado</text>
  <text x="1138" y="404" class="node-body">• Modificación de Capacidad (Mínimo: 4 inscritos)</text>
  <text x="1138" y="422" class="node-body">• Estado: PUBLICADO / LLENO / CERRADO</text>
  <text x="1138" y="440" class="node-body">• Reporte de alumnos inscritos en el grupo</text>
  <text x="1138" y="458" class="node-body">• Botón 'Ver Lista de Alumnos' y 'Descargar CSV'</text>
  <rect x="1134" y="534" width="294" height="24" rx="4" fill="#DCFCE7" />
  <text x="1144" y="550" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#166534">PUT /api/v1/tutoring-groups/{id}</text>

  <!-- Group Flow Outcome Summary -->
  <rect x="794" y="600" width="642" height="300" rx="8" fill="#1E293B" stroke="#3A506B" />
  <text x="810" y="626" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">📋 Reglas de Validación de Grupos de Tutoría:</text>
  <text x="810" y="650" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">• <strong>Regla R04 (Capacidad Máxima 5):</strong> Ningún grupo puede superar 5 alumnos inscritos bajo ninguna circunstancia.</text>
  <text x="810" y="674" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">• <strong>Protección de Cupo Mínimo:</strong> En EditGroupModal, no se permite reducir la capacidad por debajo de la cantidad de alumnos ya inscritos (ej. si hay 4 inscritos, el mínimo permitido es 4).</text>
  <text x="810" y="698" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">• <strong>Notificación de Modificaciones:</strong> Cualquier cambio en el horario o docente notifica a los alumnos agendados y queda registrado en AuditLogsPage.</text>

  <!-- Connectors Subflow B -->
  <path d="M 949 280 L 949 320" class="conn-line-dashed" marker-end="url(#arrow-amber)" />
  <path d="M 1281 280 L 1281 320" class="conn-line-dashed" marker-end="url(#arrow-amber)" />
</svg>